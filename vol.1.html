<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RSPM‑RESPO Master Index</title>

<style>
body {
  font-family: serif;
  background: #fafafa;
  padding: 40px;
  color: #222;
}

.section {
  margin: 20px auto;
  max-width: 1000px;
  padding: 20px;
  border-left: 4px solid #444;
  background: white;
}

.station-title {
  font-size: 22px;
  margin-bottom: 10px;
  font-weight: bold;
}

.karo {
  width: 20px;
  height: 20px;
  display: inline-block;
  margin-right: 10px;
  border: 1px solid #333;
}

.point {
  font-size: 14px;
  color: #333;
}
</style>
</head>

<body>

<h1>RSPM‑RESPO Master Index</h1>

<div id="stations"></div>

<script type="module">

// CSV Loader
async function loadCSV(path) {
  const text = await fetch(path).then(r => r.text());
  const lines = text.trim().split("\n");
  const header = lines[0].split(";");
  return lines.slice(1).map(line => {
    const cols = line.split(";");
    const obj = {};
    header.forEach((h, i) => obj[h] = cols[i]);
    return obj;
  });
}

// Vector Interpreter
function interpretVector(row) {
  return {
    id: row.id,
    tmp: row.tmp,
    sym: row.sym,
    color: row.color,

    axis: {
      x: (row.D - row.A),
      y: (row.W - row.S),
      z: (row.Y - row.C),
      rot: (row.E - row.Q)
    },

    score: (
      Number(row.W) +
      Number(row.A) +
      Number(row.D) +
      Number(row.S) +
      Number(row.Q) +
      Number(row.E) +
      Number(row.Y) +
      Number(row.C)
    )
  };
}

// Stationen definieren
const stations = [
  { name: "reS", file: "reS.nav.vector.csv", color: "#ff0000" },
  { name: "reG", file: "reG.nav.vector.csv", color: "#00aa00" },
  { name: "reA", file: "reA.nav.vector.csv", color: "#00ffaa" },
  { name: "reB", file: "reB.nav.vector.csv", color: "#0044ff" },
  { name: "reC", file: "reC.nav.vector.csv", color: "#ffaa00" }
];

// Render System
async function renderStations() {
  let html = "";

  for (const st of stations) {
    const raw = await loadCSV("./" + st.file);
    const vecs = raw.map(interpretVector);

    html += `<div class="section">
      <div class="station-title">${st.name} – ${st.file}</div>
    `;

    vecs.forEach(v => {
      html += `
        <div class="karo" style="background:${v.color}"></div>
        <span class="point">
          id:${v.id} | tmp:${v.tmp} | sym:${v.sym} |
          x:${v.axis.x} y:${v.axis.y} z:${v.axis.z} rot:${v.axis.rot} |
          score:${v.score}
        </span><br>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("stations").innerHTML = html;
}

renderStations();

</script>

</body>
</html>
